robot_radius: 0.2
map_type: costmap

static_layer:
  enabled:              true
  unknown_cost_value: -1
  lethal_cost_threshold: 100
  
obstacle_layer:
  enabled:              true    # 确保障碍层启用（真正生效也依赖 move_base 的 plugins 列表）
  max_obstacle_height:  2.0
  origin_z:             0.0
  z_resolution:         0.2
  z_voxels:             10
  unknown_threshold:    10
  mark_threshold:       0
  combination_method:   1
  track_unknown_space:  false    #true needed for disabling global path planning through unknown space
  obstacle_range: 4.0 #for marking 4.0
  raytrace_range: 4.0 #for clearing 4.0
  publish_voxel_map: false
  observation_sources:  scan 
  scan:
    data_type: LaserScan
    topic: scan
    marking: true
    clearing: true
    min_obstacle_height: 0.0
    max_obstacle_height: 2.0   # 激光在低位，覆盖围栏(0.4m)与金砖(0.1m)
    obstacle_range: 4.0 # 4.0
    raytrace_range: 4.0 # 4.0
 
inflation_layer:
  enabled:              true
  cost_scaling_factor:  10  # 代价随距离快速衰减（默认10）
  inflation_radius:     0.30 # robot_radius 0.2 + 余量；原来 0.01 几乎不膨胀，路径会贴墙

