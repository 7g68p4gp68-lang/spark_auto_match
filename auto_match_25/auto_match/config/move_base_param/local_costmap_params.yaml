local_costmap:
   global_frame: odom
   robot_base_frame: base_footprint
   update_frequency: 5.0 
   publish_frequency: 2.0
   static_map: false
   rolling_window: true
   width: 4.0
   height: 4.0
   resolution: 0.05
   transform_tolerance: 5 # was 0.5
   # 注意：plugins 必须在 local_costmap 命名空间下（原来错缩进到顶层，导致
   # local_costmap 报 "Parameter plugins not provided"，障碍/膨胀层不生效）
   plugins:
     - {name: obstacle_layer,      type: "costmap_2d::VoxelLayer"}
     - {name: inflation_layer,     type: "costmap_2d::InflationLayer"}
